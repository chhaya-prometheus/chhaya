environment: dev

aws:
  region: ap-south-1
  bucket: chhaya-delhi

local:
  raw_dir: data/raw
  derived_dir: data/derived

fixtures:
  s3_prefix: fixtures/

artifacts:
  s3_prefix: features/

sources:
  sentinel2:
    stac_url: https://earth-search.aws.element84.com/v1
    collection: sentinel-2-l2a
    date_range: "2026-05-01/2026-06-30"
    max_cloud_cover: 20
    bands: [red, nir]
    resolution_m: 10
    composite:
      enabled: true
      scenes: 4
      window_days: 30