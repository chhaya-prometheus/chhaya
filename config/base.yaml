# pipeline/config/base.yaml

environment: dev

aws:
  region: ap-south-1
  bucket: chhaya-delhi

# Shared fixtures — uploaded once, read by everyone
fixtures:
  s3_prefix: fixtures/
  files:
    delhi_boundary: fixtures/delhi.geojson
    hex_grid:       fixtures/delhi_hex_res8.parquet

# Local scratch — downloaded per-run, never uploaded
local:
  raw_dir: data/raw
  derived_dir: data/derived

# Pipeline outputs — written by pipeline, read by API
artifacts:
  s3_prefix: features/
  files:
    cells_parquet:     features/cells.parquet
    cells_geojson:     features/cells.geojson
    pollution_latest:  features/pollution_latest.parquet
    pipeline_status:   features/pipeline_status.json
  
sources:
  sentinel2:
    stac_url: https://earth-search.aws.element84.com/v1
    collection: sentinel-2-l2a
    bbox: [76.83, 28.40, 77.35, 28.88]     # [west, south, east, north]
    date_range: "2026-05-01/2026-06-30"
    max_cloud_cover: 20
    bands: [red, nir]
    epsg: 32643                            # UTM Zone 43N (Delhi)
    resolution_m: 10
    composite:
      enabled: true
      scenes: 4         # how many scenes to composite
      window_days: 30          # max days between first and last scene